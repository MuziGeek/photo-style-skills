style: hand-tinted-photo-memory
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A monochrome photographic print selectively tinted with delicate hand-applied transparent color.
preserve:
  - Preserve all observed people and photographic tones; add only thin selective tint without fabricated damage or historical context.
  - Source subject count, recognizable identity, essential openings and connected anatomy.
  - The complete main subject within the original frame and the intended relative placement of objects.
fragments:
  - kind: medium
    order: 10
    text: A monochrome photographic print selectively tinted with delicate hand-applied transparent color.
  - kind: composition
    order: 20
    text: Preserve the original photographic composition and all observed people; apply tint within broad source-derived color regions.
  - kind: texture
    order: 30
    text: Keep fine photographic grain visible beneath uneven translucent brush tint, with restrained edge feathering.
  - kind: palette
    order: 40
    text: Use a warm monochrome base and subtle source-related color on skin, garments and a few meaningful objects.
  - kind: lighting
    order: 50
    text: Retain the original photographic tonal modeling; the tint must not repaint anatomy or replace lighting.
  - kind: detail
    order: 60
    text: Keep observed faces and hands photographically recognizable; add no scratches, damage, invented history or retro costumes.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, unrequested text, logos, signatures or watermarks.
aspect: 4:5
negative:
  - Invented people, duplicate main subjects, extra limbs, disconnected anatomy or accidental clipping.
  - Unrequested titles, logos, signatures, watermarks, fabricated labels or before-and-after panels.
  - A generic filter without the requested medium-specific physical or optical mechanism.
