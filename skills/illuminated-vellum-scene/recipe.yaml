style: illuminated-vellum-scene
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A small illuminated-manuscript painting in opaque tempera and flat gold leaf on warm vellum.
preserve:
  - Preserve observed people, activity and clothing outlines; flatten perspective and add only marginal botanical ornament.
  - Source subject count, recognizable identity, essential openings and connected anatomy.
  - The complete main subject within the original frame and the intended relative placement of objects.
fragments:
  - kind: medium
    order: 10
    text: A small illuminated-manuscript painting in opaque tempera and flat gold leaf on warm vellum.
  - kind: composition
    order: 20
    text: Keep the source people and their shared activity inside one scene; reserve narrow margins for botanical ornament.
  - kind: texture
    order: 30
    text: Show fine vellum pores, small matte tempera strokes and irregular gold-leaf seams.
  - kind: palette
    order: 40
    text: Use lapis blue, brick red, muted green and parchment cream with controlled flat gold accents.
  - kind: lighting
    order: 50
    text: Model forms with short tempera hatch marks; gold remains a material highlight rather than a glowing light source.
  - kind: detail
    order: 60
    text: Keep observed faces, hands and shared objects distinct; add no text, historical costumes or scene props.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, unrequested text, logos, signatures or watermarks.
aspect: 4:5
negative:
  - Invented people, duplicate main subjects, extra limbs, disconnected anatomy or accidental clipping.
  - Unrequested titles, logos, signatures, watermarks, fabricated labels or before-and-after panels.
  - A generic filter without the requested medium-specific physical or optical mechanism.
