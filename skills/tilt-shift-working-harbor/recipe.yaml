style: tilt-shift-working-harbor
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A photographic miniature impression created by a narrow coherent focus plane and gently increased color clarity.
preserve:
  - Change only coherent focus-plane blur and subtle color clarity; preserve observed counts, viewpoint, structure and real materials.
  - Source subject count, recognizable identity, essential openings and connected anatomy.
  - The complete main subject within the original frame and the intended relative placement of objects.
fragments:
  - kind: medium
    order: 10
    text: A photographic miniature impression created by a narrow coherent focus plane and gently increased color clarity.
  - kind: composition
    order: 20
    text: Keep the observed camera viewpoint and scene layout; choose a focus band that contains the principal subject.
  - kind: texture
    order: 30
    text: Retain real photographic materials and detail inside focus; progressively soften regions away from the same focus plane.
  - kind: palette
    order: 40
    text: Use slightly clearer source colors without candy-colored repainting or artificial toy materials.
  - kind: lighting
    order: 50
    text: Preserve source light and cast shadows; depth blur changes apparent scale, not the time of day.
  - kind: detail
    order: 60
    text: Keep main landmarks identifiable and avoid blurring the entire subject; no new figures, model bases or miniature props.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, unrequested text, logos, signatures or watermarks.
aspect: 4:5
negative:
  - Invented people, duplicate main subjects, extra limbs, disconnected anatomy or accidental clipping.
  - Unrequested titles, logos, signatures, watermarks, fabricated labels or before-and-after panels.
  - A generic filter without the requested medium-specific physical or optical mechanism.
