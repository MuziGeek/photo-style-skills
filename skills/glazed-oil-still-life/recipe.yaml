style: glazed-oil-still-life
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A traditional glazed oil painting with luminous transparent shadows and restrained opaque highlights.
preserve:
  - Preserve observed food counts, vessel openings, overlaps and tabletop relationships; change only the painting medium.
  - Source subject count, recognizable identity, essential openings and connected anatomy.
  - The complete main subject within the original frame and the intended relative placement of objects.
fragments:
  - kind: medium
    order: 10
    text: A traditional glazed oil painting with luminous transparent shadows and restrained opaque highlights.
  - kind: composition
    order: 20
    text: Preserve the exact still-life arrangement, object scale and source viewpoint on a quiet painted ground.
  - kind: texture
    order: 30
    text: Show thin transparent glaze layers over a warm underpainting, with fine brush modulation and subtle canvas weave.
  - kind: palette
    order: 40
    text: Preserve the source food and vessel color relationships; deepen shadows chromatically rather than crushing them to black.
  - kind: lighting
    order: 50
    text: Retain the source window-light direction; place small opaque highlights only where each form catches that light.
  - kind: detail
    order: 60
    text: Keep observed food portions, vessel openings and overlaps distinct; avoid sculptural impasto ridges or added historical props.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, unrequested text, logos, signatures or watermarks.
aspect: 4:5
negative:
  - Invented people, duplicate main subjects, extra limbs, disconnected anatomy or accidental clipping.
  - Unrequested titles, logos, signatures, watermarks, fabricated labels or before-and-after panels.
  - A generic filter without the requested medium-specific physical or optical mechanism.
