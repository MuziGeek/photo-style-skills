style: wet-sand-sculpture
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A recognizable sculpture made from compact damp beach sand, with carved grooves and naturally crumbling edges.
preserve:
  - Translate surfaces into stable sand volumes while preserving observed pose, essential openings and attachments; add no sculptors or sandcastles.
  - Preserve identifying features and required negative spaces, subject to the explicitly permitted transformation.
  - Keep the complete transformed subject within the input aspect ratio.
fragments:
  - kind: medium
    order: 10
    text: A recognizable sculpture made from compact damp beach sand, with carved grooves and naturally crumbling edges.
  - kind: composition
    order: 20
    text: Preserve the observed silhouette, pose and openings while converting the subject into a stable freestanding sand form.
  - kind: texture
    order: 30
    text: Show fine packed grains, moist darker cuts, shallow tool scrapes and a small amount of loose sand at contact points.
  - kind: palette
    order: 40
    text: Replace surface colors with warm sand tones; preserve identifying patterns as shallow relief or controlled sand-value differences.
  - kind: lighting
    order: 50
    text: Keep a coherent broad daylight direction, making relief readable through soft shadows without glossy wet reflections.
  - kind: detail
    order: 60
    text: Keep attachments structurally connected; avoid sculptors, beach toys, castles, cartoon faces or props absent from the input.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, unrequested text, logos, signatures or watermarks.
aspect: 4:5
negative:
  - Invented people, duplicate main subjects, extra limbs, disconnected anatomy or accidental clipping.
  - Unrequested titles, logos, signatures, watermarks, fabricated labels or before-and-after panels.
  - A generic filter without the requested medium-specific physical or optical mechanism.
