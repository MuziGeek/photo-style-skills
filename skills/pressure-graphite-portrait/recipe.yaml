style: pressure-graphite-portrait
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A graphite portrait using pressure-sensitive hatching, restrained blending and visible drawing-paper texture.
preserve:
  - Preserve observed facial proportions, age cues, expression and light direction; do not replace identity through beautification.
  - Source subject count, recognizable identity, essential openings and connected anatomy.
  - The complete main subject within the original frame and the intended relative placement of objects.
fragments:
  - kind: medium
    order: 10
    text: A graphite portrait using pressure-sensitive hatching, restrained blending and visible drawing-paper texture.
  - kind: composition
    order: 20
    text: Keep the observed head angle, expression and shoulder proportions; retain the original crop and surrounding space.
  - kind: texture
    order: 30
    text: Build midtones through intersecting graphite strokes, leaving light construction traces and selectively softened transitions.
  - kind: palette
    order: 40
    text: Use graphite greys and warm paper white only, without blue ink, charcoal dust or silver metallic sheen.
  - kind: lighting
    order: 50
    text: Follow observed facial light with varied pencil density and paper-white highlights; do not invent dramatic relighting.
  - kind: detail
    order: 60
    text: Preserve facial landmarks, age cues and any observed eyewear; avoid generic beautification or extra accessories.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, unrequested text, logos, signatures or watermarks.
aspect: 4:5
negative:
  - Invented people, duplicate main subjects, extra limbs, disconnected anatomy or accidental clipping.
  - Unrequested titles, logos, signatures, watermarks, fabricated labels or before-and-after panels.
  - A generic filter without the requested medium-specific physical or optical mechanism.
