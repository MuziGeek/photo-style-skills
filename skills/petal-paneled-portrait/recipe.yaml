style: petal-paneled-portrait
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A graphic portrait composed of overlapping flat petal-shaped planes derived from its existing hair and clothing.
preserve:
  - Source subject count, recognizable identity, main pose and connected anatomy, subject to the explicitly permitted transformation.
  - Essential openings, attachments and foreground-to-background relationships.
  - The complete main subject within the input frame; no accidental clipping.
fragments:
  - kind: medium
    order: 10
    text: A graphic portrait composed of overlapping flat petal-shaped planes derived from its existing hair and clothing.
  - kind: composition
    order: 20
    text: Retain the face and replace selected hair and garment masses with organized rounded petal lobes following the original volume.
  - kind: texture
    order: 30
    text: Use clear overlap hierarchy and a few bold matte colors; avoid adding a floral crown or enlarging the head.
  - kind: palette
    order: 40
    text: Use a controlled palette appropriate to the requested medium; retain identifying source colors whenever the mechanism permits.
  - kind: lighting
    order: 50
    text: Keep illumination internally consistent across the entire edited image, with contact shadows appropriate to the requested medium.
  - kind: detail
    order: 60
    text: Retain source subject count, essential openings and connected anatomy; remove no identifying detail unless the permitted transformation requires it.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, new lettering, logos, watermarks or an external frame.
aspect: 4:5
negative:
  - Invented people, extra limbs, duplicate main subjects or disconnected anatomy.
  - Unrequested logos, decorative writing, watermarks or fabricated technical claims.
  - A generic filter that fails to implement the specified physical or optical mechanism.
