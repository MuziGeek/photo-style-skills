style: chisel-carved-wood-animal
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A hand-carved wooden animal with exposed grain, shallow chisel facets and restrained painted markings.
preserve:
  - Preserve observed animal silhouette, pose and attachments; simplify fur into carved volumes without adding toy accessories.
  - Source subject count, recognizable identity, essential openings and connected anatomy.
  - The complete main subject within the original frame and the intended relative placement of objects.
fragments:
  - kind: medium
    order: 10
    text: A hand-carved wooden animal with exposed grain, shallow chisel facets and restrained painted markings.
  - kind: composition
    order: 20
    text: Preserve the observed animal pose and silhouette while translating soft anatomy into rounded carved wooden masses.
  - kind: texture
    order: 30
    text: Let wood grain follow solid body volumes; use shallow tool facets and smooth worn edges rather than polygon meshes.
  - kind: palette
    order: 40
    text: Use warm natural wood with thin matte paint corresponding to observed identifying markings.
  - kind: lighting
    order: 50
    text: Use soft directional light to reveal tool cuts and real carved relief without glossy plastic reflections.
  - kind: detail
    order: 60
    text: Preserve observed ears, paws, muzzle and tail attachments; avoid hinged toy limbs or invented accessories.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, unrequested text, logos, signatures or watermarks.
aspect: 4:5
negative:
  - Invented people, duplicate main subjects, extra limbs, disconnected anatomy or accidental clipping.
  - Unrequested titles, logos, signatures, watermarks, fabricated labels or before-and-after panels.
  - A generic filter without the requested medium-specific physical or optical mechanism.
