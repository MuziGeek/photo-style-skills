style: blue-ballpoint-bicycle
version: 1
strength: strong
model_family: codex-imagegen
required_capability: image_edit
medium_anchor: A blue-ballpoint drawing on faintly ruled notebook paper, built from pressure-sensitive loops and hatching.
preserve:
  - Preserve observed openings, contours and attachments; notebook ruling is a substrate, not permission to invent components or technical labels.
  - Source subject count, recognizable identity, essential openings and connected anatomy.
  - The complete main subject within the original frame and the intended relative placement of objects.
fragments:
  - kind: medium
    order: 10
    text: A blue-ballpoint drawing on faintly ruled notebook paper, built from pressure-sensitive loops and hatching.
  - kind: composition
    order: 20
    text: Keep the complete observed object and viewpoint; preserve openings, circular parts and structural attachments.
  - kind: texture
    order: 30
    text: Build dense blue looped strokes, occasional tiny ink accumulations and light exploratory lines.
  - kind: palette
    order: 40
    text: Use one blue ink family with paper white; line density alone must describe the object colors.
  - kind: lighting
    order: 50
    text: Follow the source light through sparse highlight strokes and concentrated blue hatching in dark areas.
  - kind: detail
    order: 60
    text: Keep observed mechanical connections coherent; retain thin spokes or supports only where present and do not invent components.
  - kind: finish
    order: 70
    text: Deliver one finished image at the input aspect ratio, without comparison panels, unrequested text, logos, signatures or watermarks.
aspect: 4:5
negative:
  - Invented people, duplicate main subjects, extra limbs, disconnected anatomy or accidental clipping.
  - Unrequested titles, logos, signatures, watermarks, fabricated labels or before-and-after panels.
  - A generic filter without the requested medium-specific physical or optical mechanism.
